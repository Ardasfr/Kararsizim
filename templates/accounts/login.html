{% extends 'base.html' %}

{% block title %}Giriş Yap — Kararsızım{% endblock %}

{% block content %}
<div class="card" style="max-width: 440px; margin: 2rem auto;">
  <div style="text-align: center; margin-bottom: 1.5rem;">
    <span style="font-size: 2.5rem;">👋</span>
    <h1 style="font-family: var(--font-display); font-size: 1.5rem; font-weight: 800; margin-top: 0.5rem;">
      Tekrar Hoş Geldin!
    </h1>
    <p style="color: var(--text-secondary); font-size: 0.9rem;">
      Hesabına giriş yap ve anketlerini yönet.
    </p>
  </div>

  <form method="POST" action="{% url 'accounts:login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
    {% csrf_token %}

    <div class="form-group">
      <label for="{{ form.username.id_for_label }}" class="form-label">Kullanıcı Adı</label>
      {{ form.username }}
    </div>

    <div class="form-group">
      <label for="{{ form.password.id_for_label }}" class="form-label">Şifre</label>
      {{ form.password }}
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
      Giriş Yap
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.875rem; color: var(--text-secondary);">
    Hesabın yok mu? <a href="{% url 'accounts:register' %}" style="font-weight: 600;">Hemen Kayıt Ol</a>
  </div>
</div>
{% endblock %}
