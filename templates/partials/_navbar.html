{% load static %}
<header class="navbar">
  <div class="navbar-container">
    <!-- Brand / Logo -->
    <a href="{% url 'polls:feed' %}" class="navbar-brand">
      <span class="brand-icon">🤔</span>
      <span>Karar<span class="brand-highlight">sızım</span></span>
      <span class="brand-badge">Topluluk</span>
    </a>

    <!-- Center Search Bar (Desktop) -->
    <form method="GET" action="{% url 'polls:feed' %}" class="navbar-search">
      <span class="navbar-search-icon">🔍</span>
      <input type="text" name="q" value="{{ q|default:'' }}" placeholder="Kararsız kaldığın bir konu ara..." class="navbar-search-input" autocomplete="off">
    </form>

    <!-- Right Controls -->
    <div class="navbar-actions">
      <!-- Dark / Light Mode Toggle -->
      <button type="button" id="theme-toggle" class="btn btn-icon" title="Temayı Değiştir" aria-label="Temayı Değiştir">
        🌙
      </button>

      {% if user.is_authenticated %}
        <a href="{% url 'polls:create' %}" class="btn btn-primary btn-sm" style="font-weight: 700;">
          <span>➕</span> Anket Aç
        </a>
        <a href="{% url 'accounts:profile' %}" class="user-pill" title="Profilimi Görüntüle">
          <span class="user-pill-avatar">{{ user.username|slice:":1"|upper }}</span>
          <span>@{{ user.username }}</span>
        </a>
        <a href="{% url 'accounts:logout' %}" class="btn btn-secondary btn-sm" title="Güvenli Çıkış Yap" style="padding: 0.4rem 0.75rem;">
          Çıkış
        </a>
      {% else %}
        <a href="{% url 'polls:create' %}" class="btn btn-primary btn-sm">
          <span>➕</span> Anket Aç
        </a>
        <a href="{% url 'accounts:login' %}" class="btn btn-secondary btn-sm">
          Giriş
        </a>
        <a href="{% url 'accounts:register' %}" class="btn btn-outline btn-sm">
          Kayıt Ol
        </a>
      {% endif %}
    </div>
  </div>
</header>
