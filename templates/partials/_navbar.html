{% load static %}
<header class="navbar">
  <div class="navbar-container">
    <a href="{% url 'polls:feed' %}" class="navbar-brand">
      <span class="brand-icon">🤔</span>
      <span>Karar<span class="brand-highlight">sızım</span></span>
    </a>

    <div class="navbar-actions">
      <!-- Dark / Light Mode Toggle -->
      <button type="button" id="theme-toggle" class="btn btn-icon" title="Temayı Değiştir" aria-label="Temayı Değiştir">
        🌙
      </button>

      {% if user.is_authenticated %}
        <a href="{% url 'polls:create' %}" class="btn btn-primary btn-sm">
          <span>➕</span> Soru Sor
        </a>
        <a href="{% url 'accounts:profile' %}" class="btn btn-secondary btn-sm" title="Profilim">
          <span>👤</span> @{{ user.username }}
        </a>
        <a href="{% url 'accounts:logout' %}" class="btn btn-outline btn-sm" title="Çıkış Yap">
          Çıkış
        </a>
      {% else %}
        <a href="{% url 'polls:create' %}" class="btn btn-primary btn-sm">
          <span>➕</span> Anket Aç
        </a>
        <a href="{% url 'accounts:login' %}" class="btn btn-secondary btn-sm">
          Giriş
        </a>
        <a href="{% url 'accounts:register' %}" class="btn btn-outline btn-sm">
          Kayıt Ol
        </a>
      {% endif %}
    </div>
  </div>
</header>
