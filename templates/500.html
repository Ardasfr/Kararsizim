<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunucu Hatası (500) — Kararsızım</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111726;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #f43f5e;
      --accent-soft: rgba(244, 63, 94, 0.15);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --border: rgba(255, 255, 255, 0.08);
      --border-radius: 16px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .error-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--border-radius);
      max-width: 520px;
      width: 100%;
      text-align: center;
      padding: 3rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .gear-icon {
      font-size: 4.5rem;
      line-height: 1;
      margin-bottom: 1.25rem;
      animation: pulseGear 3s ease-in-out infinite;
      display: inline-block;
    }
    .badge {
      display: inline-block;
      font-size: 0.825rem;
      font-weight: 800;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .btn-group {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      font-size: 0.925rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }
    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
    }
    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.14);
      transform: translateY(-2px);
    }
    @keyframes pulseGear {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.08); }
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="gear-icon">⚙️</div>
    <span class="badge">Hata 500</span>
    <h1>Sunucularımız da kararsız kaldı!</h1>
    <p>Beklenmedik bir teknik aksaklık meydana geldi. Lütfen birkaç saniye sonra sayfayı yenilemeyi dene.</p>
    <div class="btn-group">
      <button onclick="location.reload()" class="btn btn-primary">🔄 Sayfayı Yenile</button>
      <a href="/" class="btn btn-secondary">🏠 Ana Sayfaya Dön</a>
    </div>
  </div>
</body>
</html>
